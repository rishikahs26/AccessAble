<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Full viewport scaling for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AccessAble - Inclusive communication assistant with sign language recognition, live captions, and OCR scanning." />

    <!-- Allow Camera/Mic permissions -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*" />

    <!-- PWA manifest for Add-to-Home-Screen on mobile -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Google Fonts: Inter (preconnect for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <title>AccessAble - Smart Assistant</title>

    <!-- Tailwind CSS via CDN (pinned version for stability) -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          }
        }
      }
    </script>

    <!-- Inline critical fallback styles -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        background-color: #000;
        color: #fff;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root { min-height: 100vh; }
      /* Prevent horizontal scroll on mobile */
      html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run AccessAble.</noscript>
    <div id="root"></div>
  </body>
</html>

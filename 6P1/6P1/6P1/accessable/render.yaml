# ─── Render.com Deployment Configuration ─────────────────────────────────────
# Deploy AccessAble as a single Web Service that:
#   1. Installs frontend deps and builds the React app
#   2. Installs backend deps
#   3. Starts the Express server which serves the React build + API
#
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: accessable
    runtime: node
    region: singapore       # closest to India; change to oregon/frankfurt if preferred
    plan: free              # upgrade to starter ($7/mo) to avoid spin-down

    # Root of the repo that Render clones
    rootDir: .              # top of accessable/ folder (where this file lives)

    # Install both frontend and backend dependencies, then build React
    buildCommand: |
      npm install &&
      npm run build &&
      cd backend && npm install

    # Start the Express server (serves built React + API)
    startCommand: cd backend && node server.js

    # Environment variables – set actual values in the Render dashboard
    # (never commit real secrets to this file)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000           # Render assigns its own port; this is the internal one
      - key: MONGO_URI
        sync: false            # mark as secret – set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: accessable
          property: host       # auto-filled with this service's public URL

    # Health check so Render knows the app is up
    healthCheckPath: /api/health
